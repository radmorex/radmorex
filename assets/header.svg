<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 190" width="850" height="190" role="img" aria-label="Broshen">
  <style>
    .name { font: 700 58px "Helvetica Neue", Arial, sans-serif; letter-spacing: 14px; text-anchor: middle; }
    .jp { font: 400 15px "Hiragino Sans", "Noto Sans CJK JP", "Yu Gothic", sans-serif; letter-spacing: 10px; text-anchor: middle; fill: #8b949e; }
    .main { fill: #f0f6fc; }
    .glitch-r { fill: #d73a49; animation: glitch 5s steps(1) infinite; }
    .glitch-g { fill: #8b949e; animation: glitch 5s steps(1) infinite reverse; }
    .slash { stroke: #d73a49; stroke-width: 2; stroke-dasharray: 300; animation: draw 5s ease-in-out infinite; }
    @keyframes glitch {
      0%, 86%, 100% { transform: translate(0, 0); opacity: 0; }
      87% { transform: translate(-5px, 2px); opacity: .9; }
      90% { transform: translate(6px, -2px); opacity: .9; }
      93% { transform: translate(-3px, 0); opacity: .9; }
      96% { transform: translate(0, 0); opacity: 0; }
    }
    @keyframes draw {
      0% { stroke-dashoffset: 300; }
      25%, 80% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -300; }
    }
    @media (prefers-reduced-motion: reduce) {
      .glitch-r, .glitch-g, .slash { animation: none; }
      .glitch-r, .glitch-g { opacity: 0; }
    }
  </style>
  <text class="name glitch-r" x="425" y="100">BROSHEN</text>
  <text class="name glitch-g" x="425" y="100">BROSHEN</text>
  <text class="name main" x="425" y="100">BROSHEN</text>
  <line class="slash" x1="275" y1="122" x2="575" y2="122"/>
  <text class="jp" x="425" y="156">私のマシンでは動く</text>
</svg>
